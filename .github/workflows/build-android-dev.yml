name: Build Android APK (dev)

on:
  workflow_dispatch:      # Lets you trigger it manually from the Actions tab
  push:
    branches: [ dev ]     # Auto-builds on pushes to dev; change/remove as needed

jobs:
  build-android:
    runs-on: ubuntu-latest   # Android builds don't need a macOS runner - much faster/cheaper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Install .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore dependencies (Android head only)
        run: dotnet restore OpenUtauMobile.Android/OpenUtauMobile.Android.csproj

      - name: Build APK (Debug)
        run: |
          dotnet build OpenUtauMobile.Android/OpenUtauMobile.Android.csproj \
            -f net10.0-android36.0 \
            -c Debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-android-arm64-dev
          path: OpenUtauMobile.Android/bin/Debug/net10.0-android36.0/**/*.apk
          if-no-files-found: error
