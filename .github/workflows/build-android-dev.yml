name: Build Android APK (dev)

on:
  workflow_dispatch:      # Lets you trigger it manually from the Actions tab
  push:
    branches: [ dev ]     # Auto-builds on pushes to dev; change/remove as needed

jobs:
  build-android:
    runs-on: ubuntu-latest   # Android builds don't need a macOS runner - much faster/cheaper

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Patch shared libraries to also target net9.0
        run: |
          FILES=(
            "OpenUtau.Core/OpenUtau.Core.csproj"
            "OpenUtau.Plugin.Builtin/OpenUtau.Plugin.Builtin.csproj"
            "OpenUtauMobile.Plugin.Renderers/OpenUtauMobile.Plugin.Renderers.csproj"
          )
          for f in "${FILES[@]}"; do
            if [ -f "$f" ]; then
              sed -i.bak -E 's#<TargetFramework>net10\.0</TargetFramework>#<TargetFrameworks>net9.0;net10.0</TargetFrameworks>#' "$f"
              sed -i.bak -E 's#<TargetFrameworks>net10\.0</TargetFrameworks>#<TargetFrameworks>net9.0;net10.0</TargetFrameworks>#' "$f"
              sed -i.bak -E "s#(<TargetFrameworks>net9\.0;net10\.0</TargetFrameworks>)#\1\n    <AndroidGenerateResourceDesigner Condition=\"\$(TargetFramework.Contains('android'))\">false</AndroidGenerateResourceDesigner>#" "$f"
              echo "=== $f ==="
              grep -i "TargetFramework\|AndroidGenerateResourceDesigner" "$f"
            else
              echo "WARNING: $f not found - path may have changed"
            fi
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Install .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore dependencies (Android only)
        run: dotnet restore OpenUtauMobile/OpenUtauMobile.csproj -p:TargetFramework=net9.0-android

      - name: Build APK (Debug)
        run: |
          dotnet publish OpenUtauMobile/OpenUtauMobile.csproj \
            -f net9.0-android \
            -c Debug \
            -p:RuntimeIdentifier=android-arm64 \
            -p:TargetFrameworks=net9.0-android \
            -p:AndroidPackageFormat=apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-android-arm64-dev
          path: OpenUtauMobile/bin/Debug/net9.0-android/**/*.apk
