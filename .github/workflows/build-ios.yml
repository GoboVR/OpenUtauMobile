name: Build iOS IPA (dev)

on:
  workflow_dispatch:      # Lets you trigger it manually from the Actions tab
  push:
    branches: [ dev ]     # Auto-builds on pushes to dev; change/remove as needed

jobs:
  build-ios:
    runs-on: macos-26      # Newest hosted runner - needs a modern Xcode for net10.0-ios

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Show available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Select newest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$LATEST" ]; then LATEST="/Applications/Xcode.app"; fi
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"

      - name: Install .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install iOS workload
        run: dotnet workload install ios

      - name: Restore dependencies (iOS head only)
        run: dotnet restore OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj

      - name: Build IPA (Debug, ad-hoc signed)
        run: |
          dotnet publish OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj \
            -f net10.0-ios \
            -c Debug \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:SelfContained=true \
            -p:CodesignKey="-"

      - name: Inspect build output folder contents
        run: |
          echo "--- contents of ios-arm64 build output ---"
          ls -la "OpenUtauMobile.iOS/bin/Debug/net10.0-ios/ios-arm64/"
          echo ""
          echo "--- looking for the actual Mach-O executable (no extension, executable bit set) ---"
          find "OpenUtauMobile.iOS/bin/Debug/net10.0-ios/ios-arm64/" -maxdepth 1 -type f -perm +111

      - name: Package IPA manually from build output
        run: |
          SRC="OpenUtauMobile.iOS/bin/Debug/net10.0-ios/ios-arm64"
          APP="Payload/OpenUtauMobile.iOS.app"
          mkdir -p "$APP"
          cp -r "$SRC"/* "$APP"/
          mkdir -p out
          zip -r out/OpenUtauMobile.iOS.ipa Payload
          echo "--- ipa contents ---"
          unzip -l out/OpenUtauMobile.iOS.ipa | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-ios-ipa-dev
          path: out/OpenUtauMobile.iOS.ipa
          if-no-files-found: error
