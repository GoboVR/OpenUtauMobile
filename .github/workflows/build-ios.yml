name: Build iOS IPA (dev)

on:
  workflow_dispatch:      # Lets you trigger it manually from the Actions tab
  push:
    branches: [ dev ]     # Auto-builds on pushes to dev; change/remove as needed

jobs:
  build-ios:
    runs-on: macos-26      # Newest hosted runner - default Xcode satisfies current .NET iOS workload requirements

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Patch shared libraries to also target net9.0
        run: |
          FILES=(
            "OpenUtau.Core/OpenUtau.Core.csproj"
            "OpenUtau.Plugin.Builtin/OpenUtau.Plugin.Builtin.csproj"
            "OpenUtauMobile.Plugin.Renderers/OpenUtauMobile.Plugin.Renderers.csproj"
          )
          for f in "${FILES[@]}"; do
            if [ -f "$f" ]; then
              sed -i.bak -E 's#<TargetFramework>net10\.0</TargetFramework>#<TargetFrameworks>net9.0;net10.0</TargetFrameworks>#' "$f"
              sed -i.bak -E 's#<TargetFrameworks>net10\.0</TargetFrameworks>#<TargetFrameworks>net9.0;net10.0</TargetFrameworks>#' "$f"
              echo "=== $f ==="
              grep -i "TargetFramework" "$f"
            else
              echo "WARNING: $f not found - path may have changed"
            fi
          done

      - name: Show available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Select latest Xcode version
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Install .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios

      - name: Restore dependencies (iOS only)
        run: dotnet restore OpenUtauMobile/OpenUtauMobile.csproj -p:TargetFramework=net9.0-ios

      - name: Build IPA (ad-hoc signed, Debug)
        run: |
          dotnet publish OpenUtauMobile/OpenUtauMobile.csproj \
            -f net9.0-ios \
            -c Debug \
            -p:ArchiveOnBuild=true \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:TargetFrameworks=net9.0-ios \
            -p:CodesignKey="-" \
            -p:BuildIpa=true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-ios-ipa-dev
          path: OpenUtauMobile/bin/Debug/net9.0-ios/ios-arm64/publish/*.ipa
