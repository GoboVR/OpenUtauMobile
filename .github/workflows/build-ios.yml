name: Build iOS IPA (dev)

on:
  workflow_dispatch:      # Lets you trigger it manually from the Actions tab
  push:
    branches: [ dev ]     # Auto-builds on pushes to dev; change/remove as needed

jobs:
  build-ios:
    runs-on: macos-26      # Newest hosted runner - needs a modern Xcode for net10.0-ios

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Show available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Select newest available Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          if [ -z "$LATEST" ]; then LATEST="/Applications/Xcode.app"; fi
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"

      - name: Install .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install iOS workload
        run: dotnet workload install ios

      - name: Generate and import self-signed signing certificate
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="temppassword"

          # Generate a self-signed cert (not Apple-issued - fine for jailbreak/AppSync installs)
          # Must include the codeSigning EKU or macOS won't treat it as a valid signing identity
          openssl req -x509 -newkey rsa:2048 -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/cert.pem" \
            -days 365 -nodes -subj "/CN=iPhone Developer: Local Build (CI)" \
            -addext "extendedKeyUsage=codeSigning" \
            -addext "keyUsage=digitalSignature" \
            -addext "basicConstraints=critical,CA:false"
          openssl pkcs12 -export -out "$RUNNER_TEMP/cert.p12" \
            -inkey "$RUNNER_TEMP/key.pem" -in "$RUNNER_TEMP/cert.pem" \
            -password "pass:$KEYCHAIN_PASSWORD" -legacy

          # Create a fresh temporary keychain and make it the default/search target
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')
          security default-keychain -s "$KEYCHAIN_PATH"

          # Import the cert and allow codesign to use it without a prompt
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$KEYCHAIN_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Self-signed certs aren't trusted by default - explicitly trust it for code signing,
          # or find-identity will keep reporting 0 valid identities even though it's imported
          sudo security add-trusted-cert -d -r trustRoot -k "$KEYCHAIN_PATH" "$RUNNER_TEMP/cert.pem"

          echo "--- Identities now available ---"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Restore dependencies (iOS head only)
        run: dotnet restore OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj

      - name: Build (Debug, self-signed, no archive)
        run: |
          dotnet publish OpenUtauMobile.iOS/OpenUtauMobile.iOS.csproj \
            -f net10.0-ios \
            -c Debug \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:SelfContained=true \
            -p:CodesignKey="iPhone Developer: Local Build (CI)"

      - name: Check for a real native executable
        run: |
          OUT="OpenUtauMobile.iOS/bin/Debug/net10.0-ios/ios-arm64"
          echo "--- all files without an extension (candidate native executables) ---"
          find "$OUT" -maxdepth 1 -type f ! -name "*.*"
          echo ""
          echo "--- running 'file' on each candidate ---"
          for f in $(find "$OUT" -maxdepth 1 -type f ! -name "*.*"); do
            echo "$f:"
            file "$f"
          done
          echo ""
          echo "--- codesign status of the main executable, if found ---"
          MAIN="$OUT/OpenUtauMobile.iOS"
          if [ -f "$MAIN" ]; then
            codesign -dv "$MAIN" 2>&1 || echo "(not signed or codesign failed)"
          else
            echo "No file named OpenUtauMobile.iOS found at expected path."
          fi

      - name: Inspect build output
        run: |
          echo "--- searching for any .app bundle ---"
          find "OpenUtauMobile.iOS/bin/Debug/net10.0-ios" -iname "*.app" -type d
          echo ""
          echo "--- searching for any Info.plist ---"
          find "OpenUtauMobile.iOS/bin/Debug/net10.0-ios" -iname "Info.plist"
          echo ""
          echo "--- searching for any .ipa ---"
          find "OpenUtauMobile.iOS/bin/Debug/net10.0-ios" -iname "*.ipa"
          echo ""
          echo "--- full folder listing for reference ---"
          find "OpenUtauMobile.iOS/bin/Debug/net10.0-ios" -maxdepth 3

      - name: Package IPA
        run: |
          mkdir -p out
          IPA_PATH=$(find "OpenUtauMobile.iOS/bin/Debug/net10.0-ios" -iname "*.ipa" | head -n1)
          if [ -n "$IPA_PATH" ]; then
            echo "Found a real .ipa already built: $IPA_PATH"
            cp "$IPA_PATH" out/OpenUtauMobile.iOS.ipa
            exit 0
          fi

          APP_PATH=$(find "OpenUtauMobile.iOS/bin/Debug/net10.0-ios" -iname "*.app" -type d | head -n1)
          if [ -n "$APP_PATH" ]; then
            echo "Found a real .app bundle, packaging manually: $APP_PATH"
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -r out/OpenUtauMobile.iOS.ipa Payload
            exit 0
          fi

          echo "Neither a .ipa nor a proper .app bundle was found - the app bundling step did not run."
          exit 1

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenUtauMobile-ios-ipa-dev
          path: out/OpenUtauMobile.iOS.ipa
          if-no-files-found: error
